<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="The StageFront live-show soundboard with built-in effects, mic recording, and custom sound uploads.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="brand.css?v=5">
  <title>StageFront Soundboard</title>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">LIVE • ON STAGE</p>
      <h1><span class="stagefront">STAGE<span>FRONT</span></span> <small>Soundboard</small></h1>
    </div>
    <div class="header-actions">
      <button id="recordBtn" class="ghost">● Record clip</button>
      <button id="installBtn" class="ghost">Install app</button>
      <button id="stopBtn" class="stop">■ Stop all</button>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Sound controls">
      <label>Volume <input id="volume" type="range" min="0" max="1" value="0.8" step="0.01"></label>
      <label class="toggle"><input id="overlap" type="checkbox"><span></span> Allow sounds to overlap</label>
      <label class="input-picker">Audio input <select id="micSelect" aria-label="Audio input"><option value="">Default microphone</option></select></label>
      <button id="micSetupBtn" class="ghost mic-setup">Find microphones</button>
    </section>

    <section>
      <div class="section-heading"><div><p class="eyebrow">READY TO PLAY</p><h2>Show sounds</h2></div><p>Tap a pad or use keys 1–9.</p></div>
      <div id="builtins" class="pad-grid"></div>
    </section>

    <section class="custom-section">
      <div class="section-heading"><div><p class="eyebrow">MAKE IT YOURS</p><h2>My sounds</h2></div></div>
      <label class="add-card" for="fileInput"><strong>＋ Add your own sounds</strong><span>MP3, WAV, M4A, OGG or WebM • saved on this device</span></label>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
      <div id="emptyPads" class="pad-grid empty-pad-grid" aria-label="Empty custom sound pads"></div>
      <div id="customSounds" class="pad-grid custom-grid"></div>
      <p id="emptyState" class="empty">Your added sounds will appear here.</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=7"></script>
</body>
</html>
